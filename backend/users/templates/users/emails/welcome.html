<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="ro">
  <head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>{{ headline }}</title>
    <style>
      @media (max-width: 600px) {
        .mobile-px { padding-left: 16px !important; padding-right: 16px !important; }
        .mobile-py { padding-top: 32px !important; padding-bottom: 32px !important; }
        .mobile-title { font-size: 40px !important; letter-spacing: -1.2px !important; }
      }
    </style>
  </head>
  <body dir="ltr" lang="ro" style="margin:0;padding:0;background-color:#212121;">
    <table border="0" width="100%" cellpadding="0" cellspacing="0" role="presentation" align="center" style="background-color:#212121;">
      <tbody>
        <tr>
          <td align="center" style="padding:0;margin:0;">
            <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="max-width:640px;background-color:#131313;margin:0 auto;">
              <tbody>
                <tr>
                  <td class="mobile-px" style="padding:24px;">
                    <div style="width:32px;height:32px;border-radius:999px;background:#ffffff;color:#131313;font-size:18px;line-height:32px;text-align:center;font-weight:700;font-family:Arial,sans-serif;">Y</div>
                  </td>
                </tr>
                <tr>
                  <td class="mobile-px mobile-py" style="padding:64px 24px 48px;">
                    <p class="mobile-title" style="margin:0;max-width:520px;font-size:56px;line-height:1;letter-spacing:-1.68px;font-weight:700;font-family:Arial Narrow,Arial,sans-serif;color:#ffffff;text-transform:uppercase;">
                      bine ai venit la yumzy
                    </p>
                    <p style="margin:36px 0 0;max-width:490px;font-size:14px;line-height:1.6;font-weight:400;color:#c4c4c4;font-family:Arial,sans-serif;">
                      {{ body }}
                    </p>
                  </td>
                </tr>
                <tr>
                  <td class="mobile-px" style="padding:0 24px;">
                    <img
                      src="{{ site_url }}/assets/feed-friends.jpg"
                      alt="Prieteni la masă"
                      width="592"
                      style="display:block;width:100%;max-width:592px;height:220px;object-fit:cover;border:0;outline:none;text-decoration:none;"
                    />
                  </td>
                </tr>
                <tr>
                  <td class="mobile-px mobile-py" style="padding:40px 24px 48px;">
                    <p style="margin:0;max-width:320px;font-size:11px;line-height:1.6;font-weight:400;color:#7d7d7d;font-family:Arial,sans-serif;">
                      Dacă ai nevoie de ajutor pentru primele comenzi, ne poți scrie oricând la
                      <a href="mailto:{{ support_email }}" style="color:#c4c4c4;text-decoration:none;">{{ support_email }}</a>.
                    </p>
                    <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin-top:32px;">
                      <tr>
                        <td style="background-color:#ffffff;">
                          <a href="{{ button_url }}" target="_blank" style="display:inline-block;padding:14px 20px;font-size:15px;line-height:1.2;font-weight:700;color:#131313;text-decoration:none;font-family:Arial,sans-serif;">
                            {{ button_label }}
                          </a>
                        </td>
                      </tr>
                    </table>
                    <p style="margin:20px 0 0;font-size:13px;line-height:1.6;font-weight:400;color:#818181;font-family:Arial,sans-serif;">
                      {{ footnote }}
                    </p>
                  </td>
                </tr>
                <tr>
                  <td class="mobile-px" style="border-top:1px solid #2b2b2b;padding:40px 24px 48px;">
                    <p style="margin:0;max-width:360px;font-size:13px;line-height:1.6;font-weight:400;color:#c4c4c4;font-family:Arial,sans-serif;">
                      Contul tău este gata. Poți descoperi restaurante, salva adrese și plasa comenzi direct din Yumzy.
                    </p>
                    <p style="margin:24px 0 0;font-size:11px;line-height:1.6;font-weight:400;color:#c4c4c4;font-family:Arial,sans-serif;">
                      Site:
                      <a href="{{ site_url }}" target="_blank" style="color:#ffffff;text-decoration:none;">{{ site_url }}</a>
                    </p>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
