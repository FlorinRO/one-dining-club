<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark only" />
    <meta name="supported-color-schemes" content="dark only" />
    <title>{{ headline }}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#070807 !important;background:#070807 !important;color:#ffffff !important;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#070807" style="background-color:#070807 !important;background:#070807 !important;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#111111" style="max-width:560px;background-color:#111111 !important;background:#111111 !important;border:1px solid #2a2a2a;border-radius:28px;overflow:hidden;">
            <tr>
              <td background="https://yumzy.ro/assets/feed-friends.jpg" bgcolor="#0b0b0b" valign="top" style="padding:22px 24px 110px;background-color:#0b0b0b !important;background-image:linear-gradient(rgba(7,8,7,0.22), rgba(7,8,7,0.48)), url('https://yumzy.ro/assets/feed-friends.jpg');background-size:cover;background-position:center center;background-repeat:no-repeat;border-radius:28px 28px 0 0;">
                <div style="font-size:32px;line-height:1;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#ffffff !important;">YUMZ<span style="color:#67d48a !important;">Y</span></div>
                <div style="margin-top:6px;font-size:0;line-height:0;">
                  <span style="display:inline-block;width:94px;height:4px;border-radius:999px;background:#67d48a;"></span><span style="display:inline-block;width:28px;height:4px;border-radius:999px;background:#ffffff;"></span>
                </div>
              </td>
            </tr>
            <tr>
              <td bgcolor="#111111" style="padding:28px 24px 32px;background-color:#111111 !important;background:#111111 !important;border-radius:0 0 28px 28px;">
                <h1 style="margin:0 0 14px;font-size:28px;line-height:1.15;font-weight:700;color:#ffffff !important;">{{ headline }}</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.7;color:#d0d0d0 !important;">{{ body }}</p>
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td bgcolor="#070807" style="border-radius:999px;background-color:#070807 !important;background:#070807 !important;border:1px solid #8b8b8b;">
                      <a href="{{ button_url }}" style="display:inline-block;padding:16px 28px;color:#ffffff !important;text-decoration:none;font-size:15px;font-weight:700;">{{ button_label }}</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:20px 0 0;font-size:13px;line-height:1.6;color:#9c9c9c !important;">{{ footnote }}</p>
                <p style="margin:18px 0 0;font-size:12px;line-height:1.6;color:#7e7e7e !important;word-break:break-all;">
                  Dacă butonul nu funcționează, folosește acest link:<br />
                  <a href="{{ button_url }}" style="color:#67d48a !important;text-decoration:none;">{{ button_url }}</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
