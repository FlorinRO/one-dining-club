<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ headline }}</title>
  </head>
  <body style="margin:0;padding:0;background:#070807;color:#ffffff;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#070807;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.12);border-radius:28px;">
            <tr>
              <td style="padding:0;">
                <div style="position:relative;">
                  <img src="https://yumzy.ro/assets/feed-friends.jpg" alt="Yumzy dining moment" width="560" style="display:block;width:100%;height:auto;border:0;border-radius:28px 28px 0 0;" />
                  <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(7,8,7,0.18) 0%, rgba(7,8,7,0.42) 100%);border-radius:28px 28px 0 0;"></div>
                  <div style="position:absolute;top:20px;left:20px;">
                    <div style="font-size:32px;line-height:1;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#ffffff;">YUMZ<span style="color:#67d48a;">Y</span></div>
                    <div style="margin-top:6px;font-size:0;line-height:0;">
                      <span style="display:inline-block;width:94px;height:4px;border-radius:999px;background:#67d48a;"></span>
                      <span style="display:inline-block;width:28px;height:4px;border-radius:999px;background:#ffffff;"></span>
                    </div>
                  </div>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 28px 18px;">
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 32px;">
                <h1 style="margin:0 0 14px;font-size:28px;line-height:1.15;font-weight:700;color:#ffffff;">{{ headline }}</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.7;color:rgba(255,255,255,0.78);">{{ body }}</p>
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="border-radius:999px;background:#111111;border:1px solid rgba(255,255,255,0.42);">
                      <a href="{{ button_url }}" style="display:inline-block;padding:16px 28px;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;">{{ button_label }}</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:20px 0 0;font-size:13px;line-height:1.6;color:rgba(255,255,255,0.58);">{{ footnote }}</p>
                <p style="margin:18px 0 0;font-size:12px;line-height:1.6;color:rgba(255,255,255,0.42);word-break:break-all;">
                  Dacă butonul nu funcționează, folosește acest link:<br />
                  <a href="{{ button_url }}" style="color:#67d48a;text-decoration:none;">{{ button_url }}</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
